<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Deodamich — Pembayaran</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #0a0c14;
            --surface-card: #121524;
            --surface-hover: #1a1e30;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-active: rgba(255, 255, 255, 0.2);
            --text-primary: #ffffff;
            --text-secondary: #8a92a6;
            --font-family: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .bg-glow {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 30%, rgba(30, 41, 89, 0.35) 0%, rgba(10, 12, 20, 0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #10b981;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .status-dot {
            width: 6px; height: 6px;
            background-color: #10b981;
            border-radius: 50%;
        }

        .title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .methods-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
        }

        .card:hover {
            background: var(--surface-hover);
            border-color: var(--border-active);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }

        .card-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .icon-box {
            width: 46px;
            height: 46px;
            background: #ffffff;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            flex-shrink: 0;
        }

        .icon-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .card-subtitle {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .action-tag {
            font-size: 11px;
            font-weight: 700;
            color: var(--brand-color, #fff);
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .overlay.active { opacity: 1; pointer-events: auto; }

        .sheet {
            position: fixed;
            bottom: 0; left: 50%;
            transform: translateX(-50%) translateY(100%);
            width: 100%; max-width: 420px;
            background: #121420;
            border-top: 1px solid var(--border-active);
            border-radius: 28px 28px 0 0;
            padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
            z-index: 101;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .sheet.active {
            transform: translateX(-50%) translateY(0);
        }

        @media (min-width: 520px) {
            .sheet {
                bottom: auto; top: 50%;
                transform: translate(-50%, -50%) scale(0.95);
                border-radius: 28px;
                border: 1px solid var(--border-active);
                opacity: 0; pointer-events: none;
            }
            .sheet.active {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1; pointer-events: auto;
            }
        }

        .sheet-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .sheet-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sheet-title {
            font-size: 18px;
            font-weight: 700;
        }

        .btn-close {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #fff;
            width: 32px; height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        .sheet-body {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .detail-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
        }

        .detail-label {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .detail-value {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
        }

        .number-display {
            margin-top: 12px;
            font-size: 22px;
            font-weight: 800;
            color: var(--brand-color, #fff);
            letter-spacing: 1px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            border: 1px dashed rgba(255,255,255,0.15);
        }

        .qr-display {
            display: none;
            margin: 12px auto 0;
            padding: 12px;
            background: #fff;
            border-radius: 16px;
            width: fit-content;
        }

        .qr-display img {
            width: 180px; height: 180px;
            display: block;
        }

        .instruction {
            font-size: 12px;
            color: var(--text-secondary);
            text-align: center;
            line-height: 1.5;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: none;
            background: var(--brand-color, #3b82f6);
            color: #fff;
            font-family: var(--font-family);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-primary.copied {
            background: #10b981 !important;
        }

        .toast {
            position: fixed;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: #10b981;
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: bottom 0.3s ease;
            z-index: 200;
        }

        .toast.show {
            bottom: 30px;
        }

        svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="container">
        <div class="header">
            <div class="status-badge">
                <span class="status-dot"></span>
                Deodamich Official
            </div>
            <h1 class="title">Metode Pembayaran</h1>
            <p class="subtitle">Pilih saluran pembayaran manual yang tersedia</p>
        </div>

        <div class="methods-grid" id="methods-list"></div>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="sheet" id="sheet">
        <div class="sheet-header">
            <div class="sheet-brand">
                <div class="icon-box" style="width:36px; height:36px; padding:6px;">
                    <img id="sheet-logo" src="" alt="Brand">
                </div>
                <div class="sheet-title" id="sheet-title">Nama Metode</div>
            </div>
            <button class="btn-close" id="btn-close">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>

        <div class="sheet-body">
            <div class="detail-box">
                <div class="detail-label">Pemilik Akun</div>
                <div class="detail-value" id="sheet-holder">-</div>
                
                <div class="number-display" id="sheet-number"></div>
                
                <div class="qr-display" id="sheet-qr-box">
                    <img id="sheet-qr-img" src="" alt="QRIS Code">
                </div>
            </div>

            <p class="instruction" id="sheet-note"></p>

            <button class="btn-primary" id="btn-action">
                <span id="btn-icon"></span>
                <span id="btn-text">Salin Nomor</span>
            </button>
        </div>
    </div>

    <div class="toast" id="toast">Tersalin ke clipboard!</div>

    <script src="script.js"></script>
</body>
</html>
